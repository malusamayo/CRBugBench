schema_version = "1.1"

[task]
name = "swe-review-bug-detection/firecracker_fix3964_induce3904"
description = "Review PR #3904 in firecracker-microvm/firecracker and catch the latent bug later fixed by PR #3964."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "firecracker-microvm/firecracker"
inducing_pr = 3904
fix_pr = 3964
base_commit = "7c6366c70a6c9b1c383f0741abd5ea8cec5c7887"
detectability = 5
szz_confidence = "medium"
blamed_line_share = 0.667

[verifier]
