schema_version = "1.1"

[task]
name = "swe-review-bug-detection/vector_fix22528_induce21348"
description = "Review PR #21348 in vectordotdev/vector and catch the latent bug later fixed by PR #22528."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "vectordotdev/vector"
inducing_pr = 21348
fix_pr = 22528
base_commit = "b890bf6b7c855cd1970a22f8a28ba9f2872eaaea"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
