schema_version = "1.1"

[task]
name = "swe-review-bug-detection/duplicati_fix5367_induce5227"
description = "Review PR #5227 in duplicati/duplicati and catch the latent bug later fixed by PR #5367."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "duplicati/duplicati"
inducing_pr = 5227
fix_pr = 5367
base_commit = "b8151b1ddfda9dbc27b23fd1ba0912a30c6f08a6"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
