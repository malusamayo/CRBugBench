schema_version = "1.1"

[task]
name = "swe-review-bug-detection/react_fix21034_induce20998"
description = "Review PR #20998 in react/react and catch the latent bug later fixed by PR #21034."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "react/react"
inducing_pr = 20998
fix_pr = 21034
base_commit = "bf11788bf0c2e861dc6378ac9ab59d37e7c3e812"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
