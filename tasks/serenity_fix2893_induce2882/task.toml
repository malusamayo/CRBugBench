schema_version = "1.1"

[task]
name = "swe-review-bug-detection/serenity_fix2893_induce2882"
description = "Review PR #2882 in serenity-rs/serenity and catch the latent bug later fixed by PR #2893."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "serenity-rs/serenity"
inducing_pr = 2882
fix_pr = 2893
base_commit = "70844baba53c62f7619d7cb3275941df19318823"
detectability = 4
szz_confidence = "high"
blamed_line_share = 0.947

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
