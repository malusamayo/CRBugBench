schema_version = "1.1"

[task]
name = "swe-review-bug-detection/rust-libp2p_fix4621_induce2289"
description = "Review PR #2289 in libp2p/rust-libp2p and catch the latent bug later fixed by PR #4621."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "libp2p/rust-libp2p"
inducing_pr = 2289
fix_pr = 4621
base_commit = "7daa0c114543d9af7d69cffc95d6e6a213f42ec3"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
