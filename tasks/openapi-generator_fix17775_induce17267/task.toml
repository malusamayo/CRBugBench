schema_version = "1.1"

[task]
name = "swe-review-bug-detection/openapi-generator_fix17775_induce17267"
description = "Review PR #17267 in OpenAPITools/openapi-generator and catch the latent bug later fixed by PR #17775."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "OpenAPITools/openapi-generator"
inducing_pr = 17267
fix_pr = 17775
base_commit = "63f09ee846d7ac3ba9351d42e35a567ddeb724e2"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
