schema_version = "1.1"

[task]
name = "swe-review-bug-detection/machinelearning_fix4197_induce4151"
description = "Review PR #4151 in dotnet/machinelearning and catch the latent bug later fixed by PR #4197."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "dotnet/machinelearning"
inducing_pr = 4151
fix_pr = 4197
base_commit = "d867f8bacdca19b2a6dcdc5fcab12835a62ba816"
detectability = 5
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
GITHUB_TOKEN = "${GITHUB_TOKEN}"
JUDGE_MODELS = "gpt-5.5,claude-opus-4.8,gemini-3.5-flash"
JUDGE_RUNTIME = "copilot-cli"

[environment.env]
# Capture full token usage (incl. input/cached tokens) and AI-credit cost from
# the headless Copilot CLI agent. Setting this path auto-enables OpenTelemetry,
# which writes JSON-lines to /logs/agent/ (mounted to the trial's agent/ dir).
COPILOT_OTEL_FILE_EXPORTER_PATH = "/logs/agent/copilot-otel.jsonl"

