schema_version = "1.1"

[task]
name = "swe-review-bug-detection/alacritty_fix5718_induce5431"
description = "Review PR #5431 in alacritty/alacritty and catch the latent bug later fixed by PR #5718."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "alacritty/alacritty"
inducing_pr = 5431
fix_pr = 5718
base_commit = "abed2e97488f57d37743f090c16c12eff812b2ce"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]
GITHUB_TOKEN = "${GITHUB_TOKEN}"
JUDGE_MODELS = "gpt-5.5,claude-opus-4.8,gemini-3.5-flash"
JUDGE_RUNTIME = "copilot-cli"

[environment.env]
# Capture full token usage (incl. input/cached tokens) and AI-credit cost from
# the headless Copilot CLI agent. Setting this path auto-enables OpenTelemetry,
# which writes JSON-lines to /logs/agent/ (mounted to the trial's agent/ dir).
COPILOT_OTEL_FILE_EXPORTER_PATH = "/logs/agent/copilot-otel.jsonl"

[solution.env]
