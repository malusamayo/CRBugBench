schema_version = "1.1"

[task]
name = "swe-review-bug-detection/OpenRefine_fix1146_induce1079"
description = "Review PR #1079 in OpenRefine/OpenRefine and catch the latent bug later fixed by PR #1146."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "OpenRefine/OpenRefine"
inducing_pr = 1079
fix_pr = 1146
base_commit = "35b01fb33bd58760253f3c6c0524cdc50c81adc0"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
