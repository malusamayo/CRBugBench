schema_version = "1.1"

[task]
name = "swe-review-bug-detection/OpenHands_fix12238_induce11336"
description = "Review PR #11336 in OpenHands/OpenHands and catch the latent bug later fixed by PR #12238."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "OpenHands/OpenHands"
inducing_pr = 11336
fix_pr = 12238
base_commit = "fab64a51b76994e7b45297c6292a79ad2584abe8"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
