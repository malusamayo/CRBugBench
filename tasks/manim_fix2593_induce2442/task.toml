schema_version = "1.1"

[task]
name = "swe-review-bug-detection/manim_fix2593_induce2442"
description = "Review PR #2442 in ManimCommunity/manim and catch the latent bug later fixed by PR #2593."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "ManimCommunity/manim"
inducing_pr = 2442
fix_pr = 2593
base_commit = "0071d982dfc7fb5da78c3f8dcab3b3fd870c628e"
detectability = 4
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
