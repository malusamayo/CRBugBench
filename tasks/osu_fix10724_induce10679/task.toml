schema_version = "1.1"

[task]
name = "swe-review-bug-detection/osu_fix10724_induce10679"
description = "Review PR #10679 in ppy/osu and catch the latent bug later fixed by PR #10724."
authors = []
keywords = ["code-review", "bug-detection", "llm-as-a-judge"]

[metadata]
source = "openhands-bug-inducing-pairs"
repository = "ppy/osu"
inducing_pr = 10679
fix_pr = 10724
base_commit = "2d1db6a22d98cba2ee9abee07f2004336c3ba101"
detectability = 5
szz_confidence = "high"
blamed_line_share = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
